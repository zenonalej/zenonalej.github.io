  .config-bar {
    background: #fff3cd; border-bottom: 1px solid #ffc107;

    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .config-bar input {
    border: 1px solid #ffc107; border-radius: 6px; padding: 5px 10px;
    font-size: 0.85rem; width: 340px; background: #fffdf0;
  }
  .config-bar button {
    background: #ffc107; border: none; border-radius: 6px;
    padding: 5px 14px; cursor: pointer; font-weight: 600; font-size: 0.82rem;

  .filter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px;
  }
  .filter-grid input, .filter-grid select {
    border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 7px 11px; font-size: 0.85rem; width: 100%;

  .filter-grid input:focus, .filter-grid select:focus {

// ── Conexión Airtable ─────────────────────────────────────
async function connectAirtable() {
  const token = 'patFpXtk3ndC94huP.9acf2104b711636b3aef4a7d7875f62028dff6084bcc8d2c2f0cdf05c765f226';
  const base  = 'appmLEatZG3pjsQZK';
  const table = 'GRADUADOS';

  showLoading('Conectando con Airtable...');

  try {
    let records = [];
    let offset = null;
    do {
      const url = `https://api.airtable.com/v0/${base}/${encodeURIComponent(table)}` +
                  (offset ? `?offset=${offset}` : '');
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      records = records.concat(data.records.map(r => r.fields));
      offset = data.offset || null;
    } while (offset);

    allRecords = records;
    document.getElementById('demoNote').style.display = 'none';
    initTable();
  } catch(e) {
    showError(`Error al conectar con Airtable: ${e.message}<br><small>Verifica el token, Base ID y nombre de tabla.</small>`);
  }
}

function useDemoData() {

}

// ── Inicializar tabla ─────────────────────────────────────
function initTable() {
  populateSelects();
  applyFilters();
}

function populateSelects() {
  const carreras = [...new Set(allRecords.map(r =>
    r.CARRERA || r.LICENCIATURA || r.PROFESORADO || '(Sin especificar)'
  ).filter(Boolean))].sort();

  const selC = document.getElementById('fCarrera');
  selC.innerHTML = '<option value="">Todas las carreras</option>';
  carreras.forEach(c => {
    const o = document.createElement('option');
    o.value = o.textContent = c;
    selC.appendChild(o);
  });

  const años = [...new Set(allRecords.map(r => r.AÑO).filter(Boolean))].sort((a,b) => b-a);
  const selA = document.getElementById('fAnio');
  selA.innerHTML = '<option value="">Todos los años</option>';
  años.forEach(a => {
    const o = document.createElement('option');
    o.value = o.textContent = a;
    selA.appendChild(o);
  });
}

// ── Filtros ───────────────────────────────────────────────
function applyFilters() {
  const nombre  = document.getElementById('fNombre').value.toLowerCase();
  const carrera = document.getElementById('fCarrera').value;
  const sector  = document.getElementById('fSector').value;
  const anio    = document.getElementById('fAnio').value;

  filtered = allRecords.filter(r => {
    const fullName = `${r.APELLIDOS||''} ${r.NOMBRES||''}`.toLowerCase();
    const rCarrera = r.CARRERA || r.LICENCIATURA || r.PROFESORADO || '';
    const rSector  = r.SECTOR || r.TRABAJA || '';

    return (!nombre  || fullName.includes(nombre))
        && (!carrera || rCarrera === carrera)
        && (!sector  || rSector.toLowerCase().includes(sector.toLowerCase()))
        && (!anio    || (r.AÑO||'') === anio);
  });

  currentPage = 1;
  updateStats();
  renderTable();
}

function clearFilters() {
  ['fNombre','fCarrera','fSector','fAnio'].forEach(id => {
    const el = document.getElementById(id);
    el.tagName === 'SELECT' ? (el.selectedIndex = 0) : (el.value = '');
  });
  applyFilters();
}

// ── Stats ─────────────────────────────────────────────────
function updateStats() {
  document.getElementById('statTotal').textContent    = allRecords.length;
  document.getElementById('statFiltrado').textContent = filtered.length;
  document.getElementById('statPublico').textContent  =
    filtered.filter(r => (r.SECTOR||r.TRABAJA||'').toLowerCase().includes('público')).length;
  document.getElementById('statPrivado').textContent  =
    filtered.filter(r => (r.SECTOR||r.TRABAJA||'').toLowerCase().includes('privado')).length;
}

// ── Render tabla ──────────────────────────────────────────

  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filtered.slice(start, start + PAGE_SIZE);
  const cont  = document.getElementById('tableContainer');

  if (!filtered.length) {
    cont.innerHTML = '<div class="no-results">😕 No se encontraron resultados con los filtros aplicados.</div>';
    document.getElementById('paginationBar').style.display = 'none';
    return;
  }

    { key: ['APELLIDOS'],                    label: 'Apellidos' },
    { key: ['NOMBRES'],                      label: 'Nombres' },
    { key: ['CARRERA','LICENCIATURA'],       label: 'Carrera / Licenciatura' },
    { key: ['PROFESORADO'],                  label: 'Profesorado' },
    { key: ['MAESTRIA'],                     label: 'Maestría' },
    { key: ['AÑO'],                          label: 'Año' },
    { key: ['SECTOR','TRABAJA'],             label: 'Sector' },
    { key: ['LUGAR_TRABAJO','LUGAR DE TRABAJO','TRABAJO'], label: 'Lugar de Trabajo' },
    { key: ['CELULAR','CELULAR 2'],          label: 'Celular' },
    { key: ['CORREO'],                       label: 'Correo' },
  ];

  const thead = `<thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>`;
  const rows  = page.map(r => {
    const cells = cols.map(c => {
      const val = c.key.map(k => r[k]).find(v => v) || '';
      if (c.label === 'Sector') return `<td>${sectorBadge(val)}</td>`;
      if (c.label === 'Carrera / Licenciatura') return `<td>${carreraBadge(val)}</td>`;
      if (c.label === 'Correo' && val)
        return `<td><a href="mailto:${val}" style="color:#2d6a9f">${val}</a></td>`;
      return `<td>${val}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  cont.innerHTML = `<table>${thead}<tbody>${rows}</tbody></table>`;
  renderPagination();
}

function sectorBadge(s) {
  if (!s) return '';
  const sl = s.toLowerCase();
  if (sl.includes('público'))  return `<span class="badge badge-pub">${s}</span>`;
  if (sl.includes('privado'))  return `<span class="badge badge-priv">${s}</span>`;
  if (sl.includes('independ')) return `<span class="badge badge-ind">${s}</span>`;
  return `<span class="badge badge-otro">${s}</span>`;
}

function carreraBadge(c) {
  if (!c) return '';
  const cl = c.toLowerCase();
  let cls = 'tag-otras';
  if (cl.includes('administr'))    cls = 'tag-adm';
  else if (cl.includes('contad'))  cls = 'tag-cont';
  else if (cl.includes('jurídic') || cl.includes('juridic')) cls = 'tag-jur';
  else if (cl.includes('educac') || cl.includes('parvul') || cl.includes('estudio')) cls = 'tag-edu';
  else if (cl.includes('psicol'))  cls = 'tag-psi';
  else if (cl.includes('letra') || cl.includes('lenguaje')) cls = 'tag-let';
  else if (cl.includes('inglés') || cl.includes('ingles'))  cls = 'tag-ing';
  return `<span class="carrera-tag ${cls}">${c}</span>`;
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const bar   = document.getElementById('paginationBar');
  if (total <= 1) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  let html = `<span class="info">Pág. ${currentPage} de ${total} (${filtered.length} registros)</span>`;
  html += `<button onclick="goPage(1)" ${currentPage===1?'disabled':''}>«</button>`;
  html += `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;

  const range = 2;
  for (let i = Math.max(1, currentPage - range); i <= Math.min(total, currentPage + range); i++) {
    html += `<button onclick="goPage(${i})" class="${i===currentPage?'active':''}">${i}</button>`;
  }
  html += `<button onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
  html += `<button onclick="goPage(${total})" ${currentPage===total?'disabled':''}>»</button>`;
  bar.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderTable();
  document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Exportar CSV ──────────────────────────────────────────
function exportCSV() {
  if (!filtered.length) { alert('No hay datos para exportar.'); return; }
  const headers = ['APELLIDOS','NOMBRES','CARRERA','PROFESORADO','MAESTRIA','AÑO','SECTOR','LUGAR_TRABAJO','TEL_FIJO','TEL_PARTICULAR','CELULAR','CELULAR2','CORREO'];
  const rows = filtered.map(r =>
    headers.map(h => {
      const v = r[h] || r[h.replace('_',' ')] || '';
      return `"${String(v).replace(/"/g,'""')}"`;
    }).join(',')
  );
  const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'graduados_filtrado.csv';
  a.click();
}

// ── Helpers UI ────────────────────────────────────────────
function showLoading(msg = 'Cargando...') {
  document.getElementById('tableContainer').innerHTML =
    `<div class="loading"><div class="spinner"></div>${msg}</div>`;
  document.getElementById('paginationBar').style.display = 'none';
}
function showError(msg) {
  document.getElementById('tableContainer').innerHTML =
    `<div class="error-box">⚠️ ${msg}</div>`;
}
</script>
</body>
</html>
