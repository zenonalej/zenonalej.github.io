<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1d1b;--mut:#6a6660;--red:#b31b1f;--gold:#ffd400;--line:#e3ddd3;--ok:#1c8c5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.4 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh}
.brand{background:#fff;border-bottom:6px solid var(--red);box-shadow:0 6px 0 var(--ink),0 12px 0 var(--gold);margin-bottom:26px}
.brand div{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;cursor:pointer}
.brand img{height:58px}.brand b{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}.brand b i{font-style:normal;color:var(--red)}
#app{max-width:980px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:1.4rem;margin:0 0 12px}
p{margin:0 0 12px;color:var(--mut)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
input,select,textarea{width:100%;padding:12px 14px;margin:0 0 10px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-color:var(--ink)}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
.btn:hover{background:#8f1518}.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.row select{flex:1}
.opt{display:flex;gap:8px;align-items:center}.opt input[type=radio]{width:22px;margin:0 0 10px;accent-color:var(--red)}
.center{text-align:center;padding:50px 10px}
.big{font-size:3rem;font-weight:800;color:var(--red);margin:0}
.good h1{color:var(--ok)}.bad h1{color:var(--red)}
.code{font-size:clamp(3rem,12vw,6rem);font-weight:800;letter-spacing:.12em;color:var(--red);line-height:1}
.lobby{display:grid;gap:24px;grid-template-columns:auto 1fr;align-items:center}
@media(max-width:640px){.lobby{grid-template-columns:1fr;justify-items:center;text-align:center}.hopts{grid-template-columns:1fr!important}}
#qr{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line);display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chips span{background:#fff;border:1px solid var(--line);padding:6px 14px;border-radius:99px}
.top{display:flex;justify-content:space-between;color:var(--mut);gap:8px;flex-wrap:wrap}
.timer{color:var(--red);font-weight:800}
.hq{margin:16px 0}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:100%;background:var(--red)}
.hopts{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:20px}
.hopts div,.pbtns button{padding:20px 16px;border-radius:12px;font-weight:700;font-size:1.15rem}
.pbtns{display:grid;gap:12px}
.pbtns button{border:0;text-align:left;font-family:inherit;cursor:pointer;min-height:80px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc button{padding:24px 0;font:800 1.6rem inherit;font-family:inherit;border:2px solid var(--ink);background:#fff;border-radius:12px;cursor:pointer}
.sc button:active{background:var(--gold)}
.res{display:flex;align-items:flex-end;gap:12px;height:180px;margin:20px 0}
.res div{flex:1;border-radius:10px 10px 0 0;font-weight:800;text-align:center;padding-top:6px;min-height:34px;transition:height .5s}
.res .no{opacity:.35}
.cloud{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:16px 0;font-weight:800}
.op{list-style:none;padding:0;margin:16px 0}.op li{background:#fff;border:1px solid var(--line);border-left:6px solid var(--red);padding:10px 14px;border-radius:8px;margin-bottom:8px}
.ref{background:#fff8cc;border-left:6px solid var(--gold);padding:10px 14px;border-radius:8px;color:var(--ink)}
.rk{list-style:none;padding:0;margin:0 0 20px}
.rk li{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px 16px;border-radius:12px;margin-bottom:8px}
.rk li:first-child{background:var(--gold);border-color:var(--gold)}
.rk b{width:34px;font-size:1.3rem}.rk em{margin-left:auto;font-style:normal;font-weight:800}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const COL=['#b31b1f','#2d2d2a','#ffd400','#6f6b64'],TC=['#fff','#fff','#1d1d1b','#fff'],CC=['#b31b1f','#1d1d1b','#6f6b64'],SH=['▲','◆','●','■'];
const TY={quiz:'Quiz',poll:'Votación',scale:'Escala 1 a 5',cloud:'Nube de palabras',open:'Pregunta abierta'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=h=>{app.innerHTML=h};
const msg=(t,back)=>`<div class="center"><h2>${t}</h2>${back?'<button class="btn" onclick="home()">Volver</button>':''}</div>`;
let time=20,Q=[],peer,conn,players=new Map(),S={},phase='',timer,code='',myName='';
const z=(y,b,q,o,c,a)=>({y,b,q,o:o||[],c:c||0,a:a||''});
const B=['Bloque 1: Referencias','Bloque 2: Funciones lógicas','Bloque 3: Funciones condicionales','Bloque 4: Funciones de búsqueda','Bloque 5: Texto y fechas','Bloque 6: Tablas dinámicas','Bloque 7: Validación y formato condicional','Cierre de la clase'];
const DEF=[
 z('quiz',B[0],'¿Qué pasa si copias =F2*(1-M1) hacia abajo?',['Nada, funciona igual','La referencia M1 se desplaza a M2, M3… y da resultados incorrectos','Excel muestra un error automático','Se bloquea la hoja'],1),
 z('cloud',B[0],'¿Qué tecla alterna entre referencia relativa y absoluta?',0,0,'F4'),
 z('quiz',B[1],'¿Qué nivel obtiene la fila 6 (Luis, Laptop, Total 2400)?',['Baja','Media','Alta','Error'],2),
 z('open',B[1],'¿Cuál es la diferencia entre Y() y O()?',0,0,'Y exige que todas las condiciones se cumplan; O solo una.'),
 z('quiz',B[2],'¿Cuánto da =SUMAR.SI(B2:B9,"Norte",F2:F9)?',['4000','6125','9245','2700'],1),
 z('scale',B[2],'¿Qué tan clara quedó la diferencia entre SUMAR.SI y SUMAR.SI.CONJUNTO?'),
 z('quiz',B[3],'¿Para qué sirve el argumento FALSO en BUSCARV?',['Para ordenar los datos','Para buscar coincidencia exacta','Para ocultar errores','Para buscar de derecha a izquierda'],1),
 z('poll',B[3],'¿Qué función prefieres usar?',['BUSCARV','BUSCARX','INDICE + COINCIDIR','']),
 z('quiz',B[4],'¿Qué devuelve =EXTRAE("EC-2024-0045",4,4)?',['EC-2','2024','0045','-202'],1),
 z('cloud',B[4],'¿Qué función quita los espacios sobrantes de un texto?',0,0,'ESPACIOS'),
 z('quiz',B[5],'¿Cuál es el total de la región Sur?',['420','6125','2700','9245'],2),
 z('open',B[5],'¿Qué pasa con la tabla dinámica si cambias un dato de origen?',0,0,'Hay que actualizarla (clic derecho → Actualizar, o Alt + F5).'),
 z('quiz',B[6],'¿Qué tipo de validación crea un menú desplegable?',['Número entero','Fecha','Lista','Longitud de texto'],2),
 z('scale',B[7],'¿Qué tan seguro te sientes usando estas funciones solo?'),
 z('open',B[7],'¿Qué tema quieres reforzar la próxima clase?')];
let quiz=null;
try{quiz=JSON.parse(localStorage.getItem('uma-qz'))}catch(e){}
quiz=quiz||DEF;
const save=()=>{try{localStorage.setItem('uma-qz',JSON.stringify(quiz))}catch(e){}};

/* ---------- INICIO ---------- */
function home(){
 if(peer){try{peer.destroy()}catch(e){}peer=null}
 clearInterval(timer);players=new Map();phase='';
 const p=new URLSearchParams(location.search).get('sala')||'';
 show(`<h1>Clase interactiva</h1><p>Responde en vivo desde tu celular y sube en el ranking.</p>
 <div class="grid">
 <section class="card"><h2>Unirme a una sala</h2>
  <input id="jc" placeholder="Código de sala" maxlength="5" value="${esc(p)}" autocapitalize="characters" autocomplete="off">
  <input id="jn" placeholder="Tu nombre" maxlength="20" autocomplete="off">
  <button class="btn" onclick="join()">Entrar</button></section>
 <section class="card"><h2>Soy docente</h2><p>Revisa las preguntas de la guía Excel Intermedio, o crea las tuyas, y abre una sala.</p>
  <button class="btn" onclick="edit()">Preparar preguntas</button></section></div>`);
}

/* ---------- EDITOR ---------- */
function edit(){
 show(`<h1>Tus preguntas</h1><p>En los quiz, marca con el círculo la respuesta correcta. Deja vacías las opciones que no uses.</p>`+
 quiz.map((x,i)=>{while(x.o.length<4)x.o.push('');
  return `<div class="card"><p class="meta">${esc(x.b||'')}</p><div class="row"><select onchange="quiz[${i}].y=this.value;edit()">${Object.entries(TY).map(([k,v])=>`<option value="${k}" ${k==x.y?'selected':''}>${v}</option>`).join('')}</select><button class="ghost" onclick="del(${i})">Borrar</button></div>
  <input value="${esc(x.q)}" oninput="quiz[${i}].q=this.value" placeholder="Pregunta ${i+1}">`+
  (x.y=='quiz'||x.y=='poll'?x.o.map((o,j)=>`<div class="opt">${x.y=='quiz'?`<input type="radio" name="c${i}" ${x.c==j?'checked':''} onchange="quiz[${i}].c=${j}" aria-label="Correcta">`:''}<input value="${esc(o)}" oninput="quiz[${i}].o[${j}]=this.value" placeholder="Opción ${j+1}"></div>`).join('')
  :x.y=='scale'?'':`<input value="${esc(x.a||'')}" oninput="quiz[${i}].a=this.value" placeholder="Respuesta de referencia (solo la ves tú)">`)+`</div>`}).join('')+
 `<div class="card"><label>Tiempo por quiz</label><select onchange="time=+this.value">${[10,20,30,45,60].map(t=>`<option value="${t}" ${t==time?'selected':''}>${t} segundos</option>`).join('')}</select>
 <div class="row"><button class="ghost" onclick="add()">Añadir pregunta</button><button class="ghost" onclick="quiz=JSON.parse(JSON.stringify(DEF));edit()">Restaurar guía Excel</button><button class="btn" onclick="startHost()">Abrir sala</button><button class="ghost" onclick="home()">Volver</button></div></div>`);
}
function add(){quiz.push(z('quiz','','',['','','',''],0));edit();scrollTo(0,document.body.scrollHeight)}
function del(i){quiz.splice(i,1);edit()}

/* ---------- ANFITRIÓN ---------- */
function startHost(){
 Q=[];
 quiz.forEach(x=>{if(!x.q.trim())return;
  if(x.y=='quiz'||x.y=='poll'){const o=[];let c=-1;x.o.forEach((t,j)=>{if(t.trim()){if(j==x.c)c=o.length;o.push(t.trim())}});
   if(o.length<2||(x.y=='quiz'&&c<0))return;Q.push({...x,q:x.q.trim(),o,c})}
  else Q.push({...x,q:x.q.trim(),o:[]})});
 if(!Q.length)return alert('Necesitas al menos una pregunta completa. En los quiz, marca la respuesta correcta.');
 save();show(msg('Creando sala…'));
 code=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
 peer=new Peer('umaquiz-'+code);
 peer.on('open',lobby);
 peer.on('connection',c=>{c.on('data',d=>onData(c,d));c.on('close',()=>{if(phase=='lobby'){players.delete(c.peer);updLobby()}})});
 peer.on('error',e=>{if(e.type=='unavailable-id')startHost();else show(msg('No se pudo crear la sala ('+e.type+'). Revisa tu conexión.',1))});
}
function lobby(){
 phase='lobby';
 const url=location.href.split('?')[0].split('#')[0]+'?sala='+code;
 show(`<div class="lobby"><div id="qr"></div><div><p>Entra a esta página y escribe el código:</p><div class="code">${code}</div><p style="word-break:break-all;margin-top:10px">${esc(url)}</p></div></div>
 <div class="chips" id="pl"></div><button class="btn" id="go" onclick="S.i=-1;nextQ()" disabled>Empezar</button>`);
 new QRCode($('#qr'),{text:url,width:200,height:200});
 S={i:-1};updLobby();
}
function updLobby(){
 const pl=$('#pl');if(!pl)return;
 pl.innerHTML=players.size?[...players.values()].map(p=>`<span>${esc(p.name)}</span>`).join(''):'<p>Esperando jugadores…</p>';
 $('#go').disabled=!players.size;
}
function onData(c,d){
 if(d.t=='join'){players.set(c.peer,{name:String(d.name||'Anónimo').slice(0,20),score:0,conn:c,ans:null});c.send({t:'ok'});updLobby()}
 if(d.t=='ans'){const p=players.get(c.peer);if(phase!='q'||!p||p.ans)return;
  p.ans={v:typeof d.v=='string'?d.v.slice(0,200):d.v,t:Date.now()};
  const n=[...players.values()].filter(x=>x.ans).length;
  const el=$('#cnt');if(el)el.textContent=n+' de '+players.size+' respondieron';
  if(n==players.size)reveal()}
}
const board=()=>[...players.values()].sort((a,b)=>b.score-a.score);
const bcast=m=>players.forEach(p=>{try{p.conn.send(m)}catch(e){}});
function nextQ(){
 S.i++;if(S.i>=Q.length)return final();
 phase='q';players.forEach(p=>p.ans=null);S.start=Date.now();
 const x=Q[S.i],y=x.y,ch=y=='quiz'||y=='poll';S.tm=y=='quiz'?time:Math.max(time,45);
 bcast({t:'q',y,i:S.i,n:Q.length,q:x.q,o:x.o});
 show(`<div class="top"><span>Pregunta ${S.i+1} de ${Q.length}. ${TY[y]}</span><span id="cnt">0 de ${players.size} respondieron</span><span id="tm" class="timer"></span></div>
 <p class="meta">${esc(x.b||'')}</p><h1 class="hq">${esc(x.q)}</h1><div class="bar"><i id="tb"></i></div>
 ${ch?`<div class="hopts">${x.o.map((o,j)=>`<div style="background:${COL[j]};color:${TC[j]}"><b>${SH[j]}</b> ${esc(o)}</div>`).join('')}</div>`:'<p>Los participantes responden desde su celular.</p>'}
 <button class="btn" onclick="reveal()">Mostrar resultados</button>`);
 clearInterval(timer);timer=setInterval(tick,250);tick();
}
function tick(){const r=S.tm-(Date.now()-S.start)/1000;if(r<=0)return reveal();
 $('#tm').textContent=Math.ceil(r)+' s';$('#tb').style.width=(r/S.tm*100)+'%'}
function reveal(){
 if(phase!='q')return;phase='r';clearInterval(timer);
 const x=Q[S.i],y=x.y,ps=[...players.values()],pts=new Map();
 players.forEach((p,id)=>{let g=0;if(y=='quiz'&&p.ans&&p.ans.v==x.c)g=Math.round(500+500*Math.max(0,1-(p.ans.t-S.start)/1000/S.tm));p.score+=g;pts.set(id,g)});
 const b=board();
 players.forEach((p,id)=>{try{p.conn.send({t:'r',y,ok:pts.get(id)>0,pts:pts.get(id),score:p.score,rank:b.indexOf(p)+1,total:b.length})}catch(e){}});
 let vis='',ref='';
 if(y=='cloud'){const f={};ps.forEach(p=>{if(p.ans){const w=String(p.ans.v).trim().toLowerCase();f[w]=(f[w]||0)+1}});
  vis=`<div class="cloud">${Object.entries(f).map(([w,n],k)=>`<span style="font-size:${1+n*.7}rem;color:${CC[k%3]}">${esc(w)}</span>`).join('')||'Sin respuestas'}</div>`}
 else if(y=='open')vis=`<ul class="op">${ps.filter(p=>p.ans).map(p=>`<li><b>${esc(p.name)}:</b> ${esc(p.ans.v)}</li>`).join('')||'<li>Sin respuestas</li>'}</ul>`;
 else{const n=y=='scale'?5:x.o.length,cnt=Array(n).fill(0);let sum=0;
  ps.forEach(p=>{if(p.ans){cnt[y=='scale'?p.ans.v-1:p.ans.v]++;sum+=p.ans.v}});
  const mx=Math.max(1,...cnt),tot=cnt.reduce((a,c)=>a+c,0);
  vis=`<div class="res">${cnt.map((n,j)=>`<div class="${y=='quiz'&&j!=x.c?'no':''}" style="background:${COL[j%4]};color:${TC[j%4]};height:${Math.max(18,n/mx*100)}%">${y=='scale'?j+1:SH[j]} ${n}${y=='quiz'&&j==x.c?' ✓':''}</div>`).join('')}</div>`+
   (y=='scale'?`<p>Promedio: <b>${tot?(sum/tot).toFixed(1):'-'}</b> de 5</p>`:`<p>${x.o.map((o,j)=>SH[j]+' '+esc(o)).join('&nbsp;&nbsp; ')}</p>`)}
 if(y=='quiz')ref='Respuesta correcta: '+esc(x.o[x.c]);else if(x.a&&(y=='cloud'||y=='open'))ref='Respuesta de referencia: '+esc(x.a);
 const last=S.i==Q.length-1;
 show(`<div class="top"><span>Pregunta ${S.i+1} de ${Q.length}. ${TY[y]}</span></div><h1 class="hq">${esc(x.q)}</h1>${vis}
 ${ref?`<p class="ref">${ref}</p>`:''}${y=='quiz'?`<h2>Ranking</h2>${rk(b.slice(0,5))}`:''}
 <button class="btn" onclick="nextQ()">${last?'Ver ranking final':'Siguiente pregunta'}</button>`);
}
const rk=b=>`<ol class="rk">${b.map((p,i)=>`<li><b>${i+1}</b>${esc(p.name)}<em>${p.score}</em></li>`).join('')}</ol>`;
function final(){
 phase='end';const b=board();
 b.forEach((p,i)=>{try{p.conn.send({t:'end',rank:i+1,score:p.score,total:b.length,top:b.slice(0,3).map(x=>x.name)})}catch(e){}});
 show(`<h1>Ranking final</h1>${rk(b)}
 <div class="row"><button class="btn" onclick="csv()">Descargar ranking (CSV)</button><button class="ghost" onclick="home()">Inicio</button></div>`);
}
function csv(){
 const rows=['puesto,nombre,puntos',...board().map((p,i)=>`${i+1},"${p.name.replace(/"/g,'""')}",${p.score}`)];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
 a.download='ranking-uma-quizpro.csv';a.click();
}

/* ---------- JUGADOR ---------- */
function join(){
 const c=$('#jc').value.trim().toUpperCase(),n=$('#jn').value.trim();
 if(!c||!n)return alert('Escribe el código y tu nombre.');
 myName=n;show(msg('Conectando…'));
 peer=new Peer();
 peer.on('open',()=>{
  conn=peer.connect('umaquiz-'+c,{reliable:true});
  conn.on('open',()=>conn.send({t:'join',name:n}));
  conn.on('data',pd);
  conn.on('close',()=>show(msg('La sala se cerró.',1)));
 });
 peer.on('error',()=>show(msg('No se encontró la sala. Revisa el código.',1)));
}
function pd(d){
 if(d.t=='ok')show(msg('Estás dentro, '+esc(myName)+'. Espera a que empiece.'));
 if(d.t=='q'){S.a=false;const y=d.y;
  const body=y=='cloud'||y=='open'?`<${y=='open'?'textarea rows="3"':'input'} id="tx" maxlength="${y=='open'?200:30}" placeholder="Tu respuesta" autocomplete="off">${y=='open'?'</textarea>':''}<button class="btn" onclick="ans($('#tx').value.trim())">Enviar</button>`
  :y=='scale'?`<p>1 es nada claro y 5 es totalmente claro</p><div class="sc">${[1,2,3,4,5].map(n=>`<button onclick="ans(${n})">${n}</button>`).join('')}</div>`
  :`<div class="pbtns">${d.o.map((o,j)=>`<button style="background:${COL[j]};color:${TC[j]}" onclick="ans(${j})"><b>${SH[j]}</b> ${esc(o)}</button>`).join('')}</div>`;
  show(`<p class="meta">Pregunta ${d.i+1} de ${d.n}</p><h2>${esc(d.q)}</h2>${body}`)}
 if(d.t=='r')show(d.y=='quiz'?`<div class="center ${d.ok?'good':'bad'}"><h1>${d.ok?'¡Correcto!':'Incorrecto'}</h1><p class="big">+${d.pts}</p>
  <p>Vas en el puesto ${d.rank} de ${d.total} con ${d.score} puntos.</p></div>`:msg('Gracias por responder. Mira la pantalla del docente.'));
 if(d.t=='end')show(`<div class="center"><h1>Puesto ${d.rank} de ${d.total}</h1><p class="big">${d.score} puntos</p>
  <p>Podio: ${d.top.map(esc).join(', ')}</p><button class="btn" onclick="home()">Inicio</button></div>`);
}
function ans(v){if(S.a||v==='')return;S.a=true;conn.send({t:'ans',v});show(msg('Respuesta enviada. Esperando al resto…'))}

home();
</script>
</body>
